<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive kitchen order display demo from Ermias Ventures LLC.">
  <title>Kitchen Display Demo | Ermias Ventures LLC</title>
  <style>
    :root{
      --navy:#10243e; --blue:#1f5f99; --gold:#d9a441; --white:#fff;
      --bg:#eef2f5; --text:#1d2935; --muted:#627080; --border:#d9e0e7;
      --green:#1e7a52; --orange:#ad6b13; --red:#a33a3a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--navy);color:var(--white)}
    .wrap{width:min(1240px,calc(100% - 28px));margin:0 auto}
    .nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}
    .mark{width:42px;height:42px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center}
    .nav a{color:var(--white);text-decoration:none;font-weight:700}
    main{padding:28px 0 60px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}
    h1{margin:0;color:var(--navy);font-size:clamp(32px,4vw,48px)}
    .toolbar p{margin:6px 0 0;color:var(--muted)}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;border-radius:10px;min-height:42px;padding:0 16px;font-weight:800;cursor:pointer}
    .refresh{background:var(--blue);color:var(--white)}
    .clear{background:var(--white);color:var(--red);border:1px solid var(--border)}
    .statusbar{margin-bottom:18px;padding:12px 15px;border-radius:12px;background:#eaf7f0;color:var(--green);font-weight:800}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .ticket{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(16,36,62,.08)}
    .ticket-head{padding:16px 18px;background:#f8fafb;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
    .ticket-head strong{color:var(--navy);font-size:18px}
    .ticket-head small{color:var(--muted)}
    .badge{height:max-content;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}
    .new{background:#e7f0fb;color:var(--blue)}
    .preparing{background:#fff2df;color:var(--orange)}
    .ready{background:#e7f6ee;color:var(--green)}
    .completed{background:#eceff3;color:#5a6470}
    .ticket-body{padding:18px}
    .items{margin:0;padding:0;list-style:none;display:grid;gap:8px}
    .items li{display:flex;justify-content:space-between;gap:12px}
    .notes{margin-top:14px;padding:10px 12px;background:#fff8e7;border-radius:10px;color:#6b531b}
    .ticket-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
    select{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:var(--white);font-weight:700}
    .empty{grid-column:1/-1;background:var(--white);border:1px dashed var(--border);border-radius:16px;padding:48px;text-align:center;color:var(--muted)}
    @media(max-width:980px){.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.board{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><span class="mark">EV</span><span>KITCHEN DISPLAY DEMO</span></div>
    <a href="/dinein-demo.html">Open Dine-In Demo</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="toolbar">
      <div>
        <h1>Live Kitchen Orders</h1>
        <p>Orders submitted from the dine-in demo appear here automatically in the same browser.</p>
      </div>
      <div class="actions">
        <button class="refresh" onclick="renderOrders()">Refresh</button>
        <button class="clear" onclick="clearOrders()">Clear Demo Orders</button>
      </div>
    </div>

    <div class="statusbar" id="statusbar">Listening for new dine-in demo orders.</div>
    <section class="board" id="board"></section>
  </div>
</main>

<script>
  const ORDERS_KEY = "ev_demo_kitchen_orders";

  function money(value) {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(value);
  }

  function statusClass(status) {
    return status.toLowerCase().replace(/\s+/g, "-");
  }

  function renderOrders() {
    const board = document.getElementById("board");
    const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");

    if (!orders.length) {
      board.innerHTML = '<div class="empty">No demo orders yet. Open the dine-in demo and send an order to the kitchen.</div>';
      return;
    }

    board.innerHTML = orders.map(order => `
      <article class="ticket">
        <div class="ticket-head">
          <div>
            <strong>Table ${order.table}</strong><br>
            <small>${new Date(order.createdAt).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})} · ${order.id}</small>
          </div>
          <span class="badge ${statusClass(order.status)}">${order.status}</span>
        </div>

        <div class="ticket-body">
          <ul class="items">
            ${order.items.map(item => `
              <li><span>${item.quantity} × ${item.name}</span><strong>${money(item.price * item.quantity)}</strong></li>
            `).join("")}
          </ul>
          ${order.notes ? `<div class="notes"><strong>Notes:</strong> ${escapeHtml(order.notes)}</div>` : ""}
        </div>

        <div class="ticket-foot">
          <strong>${money(order.total)}</strong>
          <select onchange="updateStatus('${order.id}', this.value)">
            ${["New","Preparing","Ready","Completed"].map(status =>
              `<option value="${status}" ${status === order.status ? "selected" : ""}>${status}</option>`
            ).join("")}
          </select>
        </div>
      </article>
    `).join("");
  }

  function updateStatus(orderId, status) {
    const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
    const order = orders.find(item => item.id === orderId);
    if (order) {
      order.status = status;
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      renderOrders();
    }
  }

  function clearOrders() {
    if (confirm("Clear all public demo orders?")) {
      localStorage.removeItem(ORDERS_KEY);
      renderOrders();
    }
  }

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, char => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    })[char]);
  }

  window.addEventListener("storage", event => {
    if (event.key === ORDERS_KEY) {
      document.getElementById("statusbar").textContent = "New kitchen activity detected.";
      renderOrders();
    }
  });

  setInterval(renderOrders, 2000);
  renderOrders();
</script>
</body>
</html>
