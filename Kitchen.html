<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Try the Ermias Ventures restaurant kitchen display demo."
  >

  <title>Kitchen Display Demo | Ermias Ventures</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #eaf0f5;
      font-family: Arial, sans-serif;
    }

    .site-header {
      min-height: 64px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: #102a43;
      color: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #f97360;
      font-size: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
    }

    .brand p {
      margin: 3px 0 0;
      color: #cbd5e1;
      font-size: 12px;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-link {
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .header-link.primary {
      border-color: #0f766e;
      background: #0f766e;
    }

    .demo-notice {
      min-height: 42px;
      padding: 11px 20px;
      text-align: center;
      border-bottom: 1px solid #fed7aa;
      background: #fff7ed;
      color: #9a3412;
      font-size: 14px;
      font-weight: 700;
    }

    .kitchen-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 106px);
      border: 0;
      background: #eaf0f5;
    }

    @media (max-width: 700px) {
      html,
      body {
        overflow: auto;
      }

      .site-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-links {
        width: 100%;
      }

      .header-link {
        flex: 1;
        text-align: center;
      }

      .kitchen-frame {
        height: calc(100vh - 165px);
        min-height: 750px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="brand">

      <div class="brand-icon">👨‍🍳</div>

      <div>
        <h1>Ermias Ventures Kitchen Display Demo</h1>
        <p>Live restaurant order management demonstration</p>
      </div>

    </div>

    <div class="header-links">

      <a
        class="header-link primary"
        href="/demo"
      >
        Open Ordering Page
      </a>

      <a
        class="header-link"
        href="/online-ordering-demo"
      >
        Demo Home
      </a>

    </div>

  </header>

  <div class="demo-notice">
    Interactive demonstration only — all displayed orders are test orders.
  </div>

  <iframe
    class="kitchen-frame"
    src="https://script.google.com/macros/s/AKfycbxRy_2eCi7K-XRuuFsAfn8CEVg_ru0oigBVmhWxbFIAvc6eRxMMRnilK6lksbc5YrzJ9w/exec?page=kitchen"
    title="Ermias Ventures Kitchen Display"
    loading="eager"
  ></iframe>

</body>
</html>
